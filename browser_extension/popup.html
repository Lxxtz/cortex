<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #46ff78;
    }
    p {
      font-size: 14px;
      color: #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #46ff78;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #35d862;
    }
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>Cortex AI</h2>
  <p>Analyze reviews on the current page to uncover deep sentiment and aspects.</p>
  <button id="analyzeBtn">Analyze Reviews on Page</button>
  <div class="status" id="statusMsg">Waiting...</div>
  <script src="popup.js"></script>
</body>
</html>
